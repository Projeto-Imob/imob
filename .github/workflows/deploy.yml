name: Deploy

# Homologação (fatia 0.4; ARQUITETURA, seção 8). Depois do CI verde num push na main, monta as imagens
# com a tag do commit, publica no GHCR (pacote público, sem segredo) e pede o deploy ao servidor por SSH.
# O servidor faz backup, migrations, seed fictício e a troca da stack, e volta sozinho se a saúde falhar.
# Para voltar a um commit já publicado: Actions > Deploy > Run workflow, com o SHA completo.
#
# No ambiente "homologacao" do GitHub (preenchidos pelo Matheus):
#   secrets  DEPLOY_HOST, DEPLOY_KNOWN_HOSTS e DEPLOY_SSH_KEY (chave só do Actions, presa ao deploy.sh)
#   variável IMOB_DOMINIO (endereço da homologação)
# No repositório: a variável NEXT_PUBLIC_SENTRY_DSN, que vai para o navegador (não é segredo).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      versao:
        description: "Commit já publicado no GHCR (SHA completo, 40 caracteres)"
        required: true
        type: string

# Um deploy de cada vez, sem cancelar o que está no meio.
concurrency:
  group: deploy-homologacao
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGEM: ghcr.io/projeto-imob/imob
  IMAGEM_MIGRACAO: ghcr.io/projeto-imob/imob-migracao

jobs:
  imagens:
    name: imagens
    # Só o CI de um push na main (nunca o de uma PR).
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Imagem do app
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          push: true
          tags: ${{ env.IMAGEM }}:${{ github.event.workflow_run.head_sha }}
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=imagem-app
          cache-to: type=gha,scope=imagem-app,mode=max
      - name: Imagem de migração
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migracao
          push: true
          tags: ${{ env.IMAGEM_MIGRACAO }}:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=imagem-migracao
          cache-to: type=gha,scope=imagem-migracao,mode=max

  deploy:
    name: deploy
    needs: imagens
    # Depois das imagens, ou direto pelo Run workflow (as imagens do commit já existem no GHCR).
    if: >-
      always() && (needs.imagens.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && needs.imagens.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: homologacao
      url: https://${{ vars.IMOB_DOMINIO }}
    steps:
      - name: Versão
        id: versao
        env:
          VERSAO: ${{ github.event_name == 'workflow_dispatch' && inputs.versao || github.event.workflow_run.head_sha }}
        run: |
          [[ "$VERSAO" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Use o SHA completo do commit, com 40 caracteres."; exit 1; }
          echo "valor=$VERSAO" >> "$GITHUB_OUTPUT"
      - name: Deploy no servidor
        env:
          CHAVE: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTS_CONHECIDOS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SERVIDOR: ${{ secrets.DEPLOY_HOST }}
          VERSAO: ${{ steps.versao.outputs.valor }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$HOSTS_CONHECIDOS" > ~/.ssh/known_hosts
          # A chave só roda o deploy.sh no servidor; o texto abaixo é o pedido que ele valida.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "deploy@$SERVIDOR" "deploy hml $VERSAO"
      - name: Conferência de fora do servidor
        env:
          DOMINIO: ${{ vars.IMOB_DOMINIO }}
          VERSAO: ${{ steps.versao.outputs.valor }}
        run: |
          corpo=$(curl -fsS --retry 5 --retry-delay 5 "https://$DOMINIO/api/saude")
          echo "$corpo"
          [[ "$corpo" == *"\"versao\":\"$VERSAO\""* ]] || { echo "::error::A homologação não está servindo $VERSAO."; exit 1; }
          curl -fsS -o /dev/null "https://$DOMINIO/empreendimento/residencial-jardim-das-aguas"
      - name: Apagar a chave
        if: always()
        run: rm -f ~/.ssh/deploy
