name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Uma execução por branch: um push novo cancela a anterior (economiza minutos do Actions).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_DATA_SOURCE: local
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run catalogo
      - run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: e2e
    # Só em PR, para poupar minutos.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  banco:
    name: banco
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Mesmo Postgres da máquina local (17.12). Banco descartável do CI; as senhas abaixo só existem aqui.
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_ADMIN: postgres://postgres:postgres@localhost:5432/postgres
      DB_SENHA_MIGRATOR: ci-migrator
      DB_SENHA_APP_USER: ci-app-user
      DB_SENHA_AUTH_SERVICE: ci-auth-service
      DB_SENHA_WORKER: ci-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Recria imob_teste, aplica as migrations, grava o seed e roda os testes de banco (RLS, papéis, R.I.).
      - run: npm run test:db
