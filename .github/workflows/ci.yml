name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Uma execução por branch: um push novo cancela a anterior (economiza minutos do Actions).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_DATA_SOURCE: local
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run catalogo
      - run: npm test
      # npm run test:db (PGlite + pgTAP) entra aqui no grupo 4 (tarefa 4.1).

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: e2e
    # Só em PR, para poupar minutos.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  banco:
    name: banco
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Placeholder: no grupo 4 (tarefa 4.18) vira o contêiner postgis/postgis (Postgres 17),
      # drizzle-kit migrate, seed e pg_prove.
      - run: echo "Job banco ainda sem migrations (ativado na tarefa 4.18)."
